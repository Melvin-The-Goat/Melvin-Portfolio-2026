<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melvin's Quantum Persona Portfolio Mockup</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@react-three/fiber": "https://unpkg.com/@react-three/fiber@8.15.16/dist/react-three-fiber.esm.js",
                "@react-three/drei": "https://unpkg.com/@react-three/drei@9.99.0/index.js"
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        quantum: '#0EA5E9', // Cyan
                        photon: '#EC4899',  // Pink
                        deepSpace: '#050505', // Pure Black bg
                        darkMatter: '#0F172A', // Card bg
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 20px rgba(14, 165, 233, 0.5)',
                        'neon-pink': '0 0 20px rgba(236, 72, 153, 0.5)',
                        'persona': '8px 8px 0px 0px rgba(236,72,153,1)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: white; }
        /* Futuristic Scanline Effect Overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 100;
        }
        /* Persona-style Slant Utility */
        .slant-box { transform: skewX(-12deg); }
        .unslant-text { transform: skewX(12deg); display: block; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="scanlines"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, Suspense, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Canvas, useFrame } from '@react-three/fiber';
        import { OrbitControls, Stage, MeshDistortMaterial, TorusKnot, Sphere, Box } from '@react-three/drei';
        // Icons from a CDN since Lucide isn't easily available in standalone HTML
        const Icons = {
            ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
            Cpu: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>,
        };

        // --- 3D Components (Placeholder Shapes since we can't load local GLBs) ---
        const AnimatedPlaceholder = ({ type, color }) => {
            const meshRef = useRef();
            useFrame((state) => {
                const t = state.clock.getElapsedTime();
                meshRef.current.rotation.x = t * 0.3;
                meshRef.current.rotation.y = t * 0.4;
            });

            return (
                <mesh ref={meshRef} scale={1.5}>
                    {type === 'knot' && <torusKnotGeometry args={[1, 0.3, 128, 32]} />}
                    {type === 'sphere' && <sphereGeometry args={[1.2, 64, 64]} />}
                    {type === 'box' && <boxGeometry args={[1.5, 1.5, 1.5]} />}
                    {/* Quantum/Holographic Material */}
                    <MeshDistortMaterial color={color} envMapIntensity={1} clearcoat={1} clearcoatRoughness={0} metalness={0.9} roughness={0.1} distort={0.3} speed={2} />
                </mesh>
            );
        };

        const Viewer = ({ type, color }) => (
            <Canvas shadows dpr={[1, 2]} camera={{ position: [0, 0, 5], fov: 50 }}>
                <color attach="background" args={['#050505']} />
                <Suspense fallback={null}>
                    <Stage environment="city" intensity={1} contactShadow={{ opacity: 0.6, blur: 2 }}>
                        <AnimatedPlaceholder type={type} color={color} />
                    </Stage>
                </Suspense>
                <OrbitControls autoRotate autoRotateSpeed={1} makeDefault />
            </Canvas>
        );

        // --- Main Carousel Component ---
        const ArtCarousel = () => {
            // Mock Data simulating your actual artworks
            const artworks = [
                { title: "Knight Armor MK-IV", type: 'knot', color: '#0EA5E9', description: "High-poly character suit designed for next-gen engines. Features modular plating and PBR textures generated in Blender.", tech: "BLENDER 4.0" },
                { title: "Slime Specimen 02", type: 'sphere', color: '#EC4899', description: "Procedural shader test for a mobile RPG enemy. The subsurface scattering emphasizes its gelatinous nature.", tech: "SHADER NODES" },
                { title: "Quantum Environment Box", type: 'box', color: '#8B5CF6', description: "Low-poly asset pack demonstrating efficient UV mapping and tileable textures for level design.", tech: "GAME READY" },
            ];
            const [index, setIndex] = useState(0);
            const current = artworks[index];

            const next = () => setIndex((prev) => (prev + 1) % artworks.length);
            const prev = () => setIndex((prev) => (prev - 1 + artworks.length) % artworks.length);

            return (
                // Main Stage Container with Glass effect
                <div className="relative group max-w-5xl mx-auto bg-darkMatter/50 border border-white/10 rounded-none overflow-hidden backdrop-blur-xl shadow-neon-cyan mt-20">
                    {/* 3D Main Stage */}
                    <div className="h-[500px] w-full relative bg-gradient-to-b from-quantum/5 to-deepSpace">
                        <Viewer key={current.title} type={current.type} color={current.color} />
                        
                        {/* Persona Style Navigation Arrows */}
                        <button onClick={prev} className="absolute left-0 top-1/2 -translate-y-1/2 p-4 bg-black/50 hover:bg-quantum text-white slant-box border-r-2 border-quantum transition-all z-10 group/btn">
                            <div className="unslant-text group-hover/btn:-translate-x-1 transition-transform"><Icons.ChevronLeft /></div>
                        </button>
                        <button onClick={next} className="absolute right-0 top-1/2 -translate-y-1/2 p-4 bg-black/50 hover:bg-quantum text-white slant-box border-l-2 border-quantum transition-all z-10 group/btn">
                             <div className="unslant-text group-hover/btn:translate-x-1 transition-transform"><Icons.ChevronRight /></div>
                        </button>
                    </div>

                    {/* Info Panel: Persona Style Slant */}
                    <div className="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-black via-black/90 to-transparent flex justify-between items-end">
                        <div className="slant-box bg-photon p-6 border-l-8 border-white shadow-persona">
                            <h2 className="text-3xl font-black italic uppercase text-white tracking-tighter unslant-text mb-1">
                                {current.title}
                            </h2>
                             <div className="unslant-text flex items-center gap-2">
                                <span className="flex items-center gap-1 font-mono text-xs text-black bg-white/90 px-2 py-1 font-bold">
                                    <Icons.Cpu /> {current.tech}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Persona Slanted Navbar ---
        const Navbar = () => (
            <nav className="fixed top-0 w-full z-50 p-4">
                <div className="max-w-7xl mx-auto flex justify-between items-center relative">
                    {/* Skewed Logo Container */}
                    <div className="slant-box bg-quantum px-8 py-3 border-r-4 border-photon shadow-persona hover:translate-x-1 transition-transform cursor-pointer">
                        <span className="text-2xl font-black italic text-white unslant-text tracking-tighter">MB.AI</span>
                    </div>

                    {/* Slanted Glass Menu Buttons */}
                    <div className="flex gap-2">
                        {['Projects', '3D Lab', 'About'].map((item, i) => (
                        <button key={item} className={`px-6 py-2 border-2 backdrop-blur-md slant-box font-bold uppercase italic transition-all duration-300 group 
                            ${i === 1 ? 'bg-quantum/20 border-quantum text-white shadow-neon-cyan' : 'bg-white/5 border-white/20 text-gray-300 hover:bg-quantum hover:border-quantum hover:text-white'}`}>
                            <span className="unslant-text block group-hover:-skew-x-12 transition-transform">{item}</span>
                        </button>
                        ))}
                    </div>
                </div>
            </nav>
        );

        // --- Main App Layout ---
        function App() {
            return (
                <div className="min-h-screen bg-deepSpace bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-darkMatter to-deepSpace pb-20">
                    <Navbar />
                    {/* Hero Content */}
                    <div className="pt-32 px-6 text-center mb-12">
                         <h1 className="text-6xl md:text-7xl font-black italic uppercase bg-gradient-to-r from-quantum via-white to-photon bg-clip-text text-transparent mb-4 tracking-tighter">
                            Melvin Boateng
                        </h1>
                        <p className="text-xl text-quantum font-mono uppercase tracking-widest">MSCS • AI Concentration • Technical Artist</p>
                    </div>

                    {/* The New Carousel Section */}
                    <section id="art-carousel" className="px-4">
                         <div className="text-center mb-8">
                            <h2 className="inline-block text-3xl font-black italic uppercase bg-darkMatter px-6 py-2 slant-box border-b-4 border-quantum">
                                <span className="unslant-text">Interactive 3D Lab</span>
                            </h2>
                        </div>
                        <ArtCarousel />
                         <p className="text-center text-gray-500 mt-4 font-mono text-sm">Click and drag to inspect assets. Use arrows to navigate.</p>
                    </section>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
